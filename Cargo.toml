[workspace]
members = ["crates/wasmcop-job", "crates/wasmcop-spec", "crates/wasmcop-runner", "crates/wasmcop"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
wasmcop-job = { path = "crates/wasmcop-job" }
wasmer = { version = "=7.5.0", default-features = false }
wasmer-types = { version = "=7.5.0", default-features = false }
anyhow = "1.0.104"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
