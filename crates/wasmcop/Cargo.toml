[package]
name = "wasmcop"
version.workspace = true
edition.workspace = true

[features]
default = ["llvm"]
llvm = ["wasmer/llvm"]

[dependencies]
wasmcop-job.workspace = true
wasmer = { workspace = true, features = ["sys", "compiler", "cranelift", "singlepass"] }
wasmer-types.workspace = true
anyhow.workspace = true
serde_json.workspace = true
enumset = "1.1.15"
clap = { version = "4.6.7", features = ["derive"] }
wat = "1.263"
wasmer-compiler.workspace = true
quick-xml = "0.42.0"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
serde.workspace = true
tempfile = "3.27.0"
wasmcop-spec.workspace = true
