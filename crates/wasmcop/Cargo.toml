[package]
name = "wasmcop"
version.workspace = true
edition.workspace = true

[features]
default = ["llvm"]
llvm = ["wasmer/llvm"]

[dependencies]
wasmcop-job.workspace = true
wasmer = { workspace = true, features = ["sys", "compiler", "cranelift", "singlepass"] }
wasmer-types.workspace = true
anyhow.workspace = true
serde_json.workspace = true
enumset = "1.1.15"
clap = { version = "4.6.7", features = ["derive"] }
wat = "1.263"
turboshake = "0.7.1"
wasmer-compiler.workspace = true
wasmparser = "0.263"
quick-xml = "0.42.0"
iced-x86 = { version = "1.22.0", default-features = false, features = ["std", "decoder", "intel", "instr_info"] }
addr2line = "0.27.1"
serde.workspace = true
tempfile = "3.27.0"
wasmcop-spec.workspace = true

[dev-dependencies]
rand_chacha = "0.10"
rand_core = "0.10.1"
