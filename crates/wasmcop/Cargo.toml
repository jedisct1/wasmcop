[package]
name = "wasmcop"
version.workspace = true
edition.workspace = true

[features]
default = ["llvm"]
llvm = ["wasmer/llvm"]

[dependencies]
wasmcop-job.workspace = true
wasmer = { workspace = true, features = ["sys", "compiler", "cranelift", "singlepass"] }
anyhow.workspace = true
serde_json.workspace = true
enumset = "1.1.15"
clap = { version = "4.6.7", features = ["derive"] }
