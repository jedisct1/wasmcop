name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2

      - name: Install Valgrind's build dependencies, and a stock Valgrind for the comparison tests
        run: sudo apt-get update && sudo apt-get install -y valgrind libc6-dbg

      - name: Cache LLVM and the patched Valgrind
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/wasmcop
          key: tools-${{ hashFiles('scripts/*.sh', 'valgrind/*.patch') }}

      - name: Fetch LLVM
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/fetch-llvm.sh

      - name: Build the patched Valgrind
        if: steps.cache.outputs.cache-hit != 'true'
        run: scripts/build-valgrind.sh

      - name: Build and test
        run: LLVM_SYS_221_PREFIX=$HOME/.cache/wasmcop/llvm-22 make test
